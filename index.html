<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeParkingBA</title>
<meta name="description" content="Parkovanie v Bratislave bez pokuty: zóny PAAS, P+R a nákupné centrá na jednej mape, z oficiálnych a otvorených dát.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c9450'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='20' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i>P</i>FreePar<b>king</b>BA</div>
    <label class="search" for="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Hľadať P+R, nákupné centrum alebo zónu (napr. SM1)" autocomplete="off"></label>
    <button class="toggle" id="filterBtn" aria-pressed="true" title="Skryje miesta, ktoré ležia vo vnútri aktívnej zóny PAAS"><span>Len mimo PAAS</span><span class="sw"></span></button>
  </header>
  <div class="main">
    <div class="mapwrap">
      <div id="map" aria-label="Mapa Bratislavy"></div>
      <div class="layers" id="layers">
        <button class="layers-head" id="layersHead" aria-expanded="true">Vrstvy</button>
        <div class="layers-body" id="layersBody">
          <div class="seg" role="radiogroup" aria-label="Podklad">
            <button data-base="map" aria-pressed="true">Mapa</button><button data-base="sat" aria-pressed="false">Satelit</button>
          </div>
          <label><input type="checkbox" data-layer="zony" checked><i class="sq paas"></i>Zóny PAAS (celé mesto)</label>
          <label><input type="checkbox" data-layer="rez" checked><i class="sq rez"></i>Rezidentské úseky</label>
          <label><input type="checkbox" data-layer="plan" checked><i class="sq plan"></i>Plánované zóny</label>
          <label><input type="checkbox" data-layer="petr" checked><i class="sq pps"></i>Petržalka (PAAS, PPS)</label>
          <label><input type="checkbox" data-layer="pr" checked><i class="sq pr"></i>P+R</label>
          <label><input type="checkbox" data-layer="oc" checked><i class="sq oc"></i>Nákupné centrá</label>
          <label><input type="checkbox" data-layer="route" checked disabled><i class="sq rt"></i>Trasa</label>
        </div>
      </div>
      <div class="status" id="status">Načítavam dáta…</div>
      <div class="locbtns"><button id="gps">Moja poloha (GPS)</button><button id="pick" aria-pressed="false">Zvoliť polohu na mape</button></div>
    </div>
    <aside class="panel" id="panel"><button class="handle" id="handle" aria-label="Rozbaliť panel"><span></span></button><div class="panel-in" id="panelIn"></div></aside>
  </div>
  <nav class="tabs">
    <button data-tab="map" aria-current="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
    <button data-tab="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 18-8-8 18-2-8-8-2Z"/></svg>Navigácia</button>
    <button data-tab="src"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h8M8 8h4"/></svg>Zdroje</button>
  </nav>
</div>
<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="facts.js"></script>
<script src="app.js"></script>
</body>
</html>
